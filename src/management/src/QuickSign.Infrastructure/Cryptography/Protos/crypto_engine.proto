syntax = "proto3";

package quicksign.crypto;

option csharp_namespace = "QuickSign.Infrastructure.Cryptography.Protos";
option go_package = "quicksign/crypto/pb";

// Cryptographic engine RPC interface communicating between .NET Management and Go Engine.
service CryptoEngineService {
  // Generates an asymmetric key pair, stores private key into Vault, and returns X.509 certificate metadata.
  rpc GenerateCertificateKeyPair (GenerateKeyRequest) returns (GenerateKeyResponse);

  // Compensating transaction: Deletes an orphaned private key from Vault if downstream DB persistence fails.
  rpc DeleteCertificateKeyPair (DeleteKeyRequest) returns (DeleteKeyResponse);
}

message GenerateKeyRequest {
  string certificate_id = 1;
  string user_id = 2;
  string subject_name = 3;
  string algorithm = 4;
  int64 valid_from_unix = 5;
  int64 expires_at_unix = 6;
}

message GenerateKeyResponse {
  bool success = 1;
  string serial_number = 2;
  string public_key_pem = 3;
  string vault_key_path = 4;
  string error_message = 5;
}

message DeleteKeyRequest {
  string vault_key_path = 1;
}

message DeleteKeyResponse {
  bool success = 1;
  string message = 2;
}
